x-app: &app
  image: warehouse-services:latest
  build:
    context: .
    target: runtime
  environment:
    DATABASE_URL: postgresql+asyncpg://inventory:inventory@postgres:5432/inventory
    REDIS_URL: redis://redis:6379/0
    LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["warehouse-migrate", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  inventory_api:
    <<: *app
    command: ["inventory-api"]
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  analytics_worker:
    <<: *app
    command: ["analytics-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://inventory:inventory@postgres:5432/inventory_test
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
